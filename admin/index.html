.pills{flex-wrap:wrap;max-width:100%}.rt{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;margin:6px 0}

const sf=(id,l,v,t)=>'<label>'+l+'</label><input id="'+id+'" type="'+(t||"text")+'" value="'+esc(v==null?"":v)+'">',svB=f=>'<div style="margin-top:14px;display:flex;gap:8px"><button class="btn" id="ssv" onclick="'+f+'">Save</button><button class="btn o" onclick="closeM()">Cancel</button></div>';
async function setDoc(k,o){$("ssv").classList.add("busy");try{await db.collection("settings").doc(k).set(Object.assign(o,{updatedAt:TS()}));closeM();toast("Saved");if(k==="catalog")loadCatalog();loadSet()}catch(e){$("ssv").classList.remove("busy");toast(e.message,1)}}
async function loadSet(){$("view").innerHTML=LD;try{const r=await Promise.all(["store","shipping","catalog","push"].map(k=>db.collection("settings").doc(k).get()));STG={store:r[0].exists?r[0].data():{},shipping:r[1].exists?r[1].data():{},catalog:r[2].exists?r[2].data():{},push:r[3].exists?r[3].data():{}};
$("view").innerHTML='<h2>Settings</h2>'+[["store","Store info","Business naam, GSTIN, phone, address (invoice par dikhta hai)","stF"],["shipping","Shipping, delivery aur returns","Charge, free shipping, PIN code rules, return days","shF"],["catalog","Categories aur brands","Categories, subcategories aur brands list","caF"],["push","Push notifications key","Web Push (VAPID) key – app band hone par bhi alert ke liye","puF"]].map(x=>{const on=Object.keys(STG[x[0]]).length>0;return'<div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:12px"><div style="flex:1"><b>'+x[1]+'</b><br><small style="color:var(--mute)">'+x[2]+'</small></div><span class="bd '+(on?"active":"pending")+'">'+(on?"set":"default")+'</span><button class="btn s" onclick="'+x[3]+'()">Edit</button></div>'}).join("")}catch(x){$("view").innerHTML='<div class="err">'+esc(x.message)+'</div>'}}
function stF(){const d=STG.store;$("modc").innerHTML=hd("Store info")+sf("s_n","Business naam",d.name||"RISHVYA")+sf("s_g","GSTIN (agar hai)",d.gstin)+'<div class="g2"><div>'+sf("s_p","Phone",d.phone)+'</div><div>'+sf("s_e","Email",d.email)+'</div></div><label>Address</label><textarea id="s_a" rows="3">'+esc(d.address||"")+'</textarea>'+svB("stS()");$("mod").classList.add("on")}
const stS=()=>setDoc("store",{name:$("s_n").value.trim(),gstin:$("s_g").value.trim().toUpperCase(),phone:$("s_p").value.trim(),email:$("s_e").value.trim(),address:$("s_a").value.trim()});
function shF(){const d=STG.shipping;$("modc").innerHTML=hd("Shipping, delivery aur returns")+'<div class="g3"><div>'+sf("h_c","Delivery charge ₹",d.charge==null?49:d.charge,"number")+'</div><div>'+sf("h_f","Free shipping ₹ se upar",d.freeAbove==null?999:d.freeAbove,"number")+'</div><div>'+sf("h_r","Return days",d.returnDays==null?7:d.returnDays,"number")+'</div></div><div class="g3"><div>'+sf("h_d","Dispatch (din)",d.dispatchDays==null?1:d.dispatchDays,"number")+'</div><div>'+sf("h_n","Normal delivery (din)",d.normalDays||"4-7")+'</div><div>'+sf("h_x","Fast delivery (din)",d.fastDays||"2-4")+'</div></div>'+
sf("h_fp","Fast delivery pincode prefixes (comma se, jaise 302,110,400)",d.fastPrefixes)+sf("h_al","Sirf in pincode prefixes par delivery (khali = poore India)",d.allowedPrefixes)+sf("h_bl","In pincode prefixes par delivery band",d.blockedPrefixes)+svB("shS()");$("mod").classList.add("on")}
const shS=()=>{const n=(id,df)=>{const v=parseFloat($(id).value);return isNaN(v)?df:v};return setDoc("shipping",{charge:n("h_c",49),freeAbove:n("h_f",999),returnDays:n("h_r",7),dispatchDays:n("h_d",1),normalDays:$("h_n").value.trim()||"4-7",fastDays:$("h_x").value.trim()||"2-4",fastPrefixes:$("h_fp").value.trim(),allowedPrefixes:$("h_al").value.trim(),blockedPrefixes:$("h_bl").value.trim()})};
function caF(){const d=STG.catalog,cats=d.cats&&d.cats.length?d.cats:Object.keys(CATS).map(k=>({name:k,subs:CATS[k]}));$("modc").innerHTML=hd("Categories aur brands")+'<label>Categories (har line: Naam: sub1, sub2, sub3)</label><textarea id="c_c" rows="8">'+esc(cats.map(c=>c.name+": "+(c.subs||[]).join(", ")).join("\n"))+'</textarea><label>Brands (comma se alag)</label><textarea id="c_b" rows="2">'+esc((d.brands||BR||[]).join(", "))+'</textarea><p style="color:var(--mute);font-size:12px">Category ka naam badalne par purane products ki category nahi badalti, unhe edit karna padega.</p>'+svB("caS()");$("mod").classList.add("on")}
const caS=()=>{const cats=$("c_c").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(":"),n=(i<0?l:l.slice(0,i)).trim(),sb=i<0?[]:l.slice(i+1).split(",").map(x=>x.trim()).filter(Boolean);return{name:n,subs:sb}}).filter(c=>c.name);if(!cats.length){toast("Kam se kam ek category chahiye",1);return}return setDoc("catalog",{cats,brands:$("c_b").value.split(",").map(x=>x.trim()).filter(Boolean)})};
function puF(){const d=STG.push;$("modc").innerHTML=hd("Push notifications key")+'<p style="font-size:13px;color:var(--mute)">Firebase Console → Project settings → Cloud Messaging → <b>Web Push certificates</b> → Generate key pair. Wahan ki "Key pair" (lambi public key) yahan paste karo.</p>'+sf("p_v","Web Push key (VAPID)",d.vapid)+svB("puS()");$("mod").classList.add("on")}
const puS=()=>setDoc("push",{vapid:$("p_v").value.trim()});
</script></body></html>
