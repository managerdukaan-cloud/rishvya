name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: write

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
  HOST: ${{ github.repository_owner }}.github.io
  APP_ID: com.rishvya.store
  APP_NAME: RISHVYA

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version and secrets
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.0.1"; exit 1; }
          for v in KS_PASS KEY_PASS KEY_ALIAS KS_B64; do
            [ -n "${!v}" ] || { echo "::error::Secret for $v is missing. See RELEASE_SETUP.md step 3"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor Android project
        run: |
          mkdir shell && cd shell
          npm init -y > /dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          if [ -n "$GS_B64" ]; then npm i @capacitor/push-notifications@7; fi
          mkdir www
          echo '<!doctype html><title>RISHVYA</title><p>Loading...</p>' > www/index.html
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": {
              "url": "${SITE_URL}?shell=apk&sv=${VERSION}",
              "androidScheme": "https",
              "allowNavigation": ["${HOST}"]
            },
            "android": {
              "adjustMarginsForEdgeToEdge": "force"
            }
          }
          EOF
          npx cap add android
          if [ -n "$GS_B64" ]; then echo "$GS_B64" | base64 -d > android/app/google-services.json; fi

      - name: Version, permissions, colours
        working-directory: shell/android
        run: |
          CODE=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VERSION\"/" app/build.gradle
          grep -q "versionCode $CODE" app/build.gradle || { echo "::error::Could not set versionCode in build.gradle"; exit 1; }
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' app/src/main/AndroidManifest.xml
          sed -i 's/#FFFFFF/#581D32/' app/src/main/res/values/ic_launcher_background.xml || true

      - name: RISHVYA app icon and splash screen
        run: |
          pip install pillow > /dev/null
          test -f icons/logo.png || { echo "::error::icons/logo.png missing in repo (upload it to the icons folder)"; exit 1; }
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          res = "shell/android/app/src/main/res"
          WINE = (88, 29, 50, 255)
          logo = Image.open("icons/logo.png").convert("RGBA")

          def on_wine(w, h, frac):
              bg = Image.new("RGBA", (w, h), WINE)
              s = int(min(w, h) * frac)
              l = logo.resize((s, s), Image.LANCZOS)
              bg.alpha_composite(l, ((w - s) // 2, (h - s) // 2))
              return bg

          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          fore = {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}
          for d, sz in legacy.items():
              os.makedirs(f"{res}/mipmap-{d}", exist_ok=True)
              for n in ("ic_launcher.png", "ic_launcher_round.png"):
                  on_wine(sz, sz, 0.76).save(f"{res}/mipmap-{d}/{n}")
          for d, sz in fore.items():
              c = Image.new("RGBA", (sz, sz), (0, 0, 0, 0))
              s = int(sz * 0.78)
              c.alpha_composite(logo.resize((s, s), Image.LANCZOS), ((sz - s) // 2, (sz - s) // 2))
              c.save(f"{res}/mipmap-{d}/ic_launcher_foreground.png")

          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '    <background android:drawable="@color/ic_launcher_background"/>\n'
                 '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                 '</adaptive-icon>\n')
          os.makedirs(f"{res}/mipmap-anydpi-v26", exist_ok=True)
          for n in ("ic_launcher.xml", "ic_launcher_round.xml"):
              open(f"{res}/mipmap-anydpi-v26/{n}", "w").write(xml)
          open(f"{res}/values/ic_launcher_background.xml", "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#581D32</color>\n</resources>\n')

          n = 0
          sp = Image.open("icons/splash.png").convert("RGB") if os.path.exists("icons/splash.png") else None
          for f in glob.glob(f"{res}/drawable*/splash*.png"):
              w, h = Image.open(f).size
              if sp is not None:
                  k = max(w / sp.width, h / sp.height)
                  r = sp.resize((int(sp.width * k) + 1, int(sp.height * k) + 1), Image.LANCZOS)
                  x, y = (r.width - w) // 2, (r.height - h) // 2
                  r.crop((x, y, x + w, y + h)).save(f)
              else:
                  on_wine(w, h, 0.36).convert("RGB").save(f)
              n += 1
          print("splash images replaced:", n)
          if n == 0:
              print("::warning::No splash images found to replace")
          PY

      - name: Build release APK and AAB
        working-directory: shell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign APK and AAB
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=shell/android/app/build/outputs
          APK=$(ls $OUT/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out rishvya.apk aligned.apk
          "$BT/apksigner" verify --print-certs rishvya.apk | head -3
          cp $OUT/bundle/release/app-release.aab rishvya.aab
          jarsigner -keystore release.jks -storepass:env KS_PASS -keypass:env KEY_PASS -digestalg SHA-256 -sigalg SHA256withRSA rishvya.aab "$KEY_ALIAS"
          rm -f release.jks aligned.apk

      - name: Keep AAB for Play Store (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: rishvya-playstore-aab-${{ inputs.version }}
          path: rishvya.aab
          retention-days: 30

      - name: Publish APK in GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: RISHVYA ${{ inputs.version }}
          files: rishvya.apk
