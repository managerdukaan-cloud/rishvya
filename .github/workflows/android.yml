name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: write

env:
  SITE_URL: https://managerdukaan-cloud.github.io/aavira/
  APP_ID: com.aavira.store
  APP_NAME: AAVIRA

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version and secrets
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.0.1"; exit 1; }
          for v in KS_PASS KEY_PASS KEY_ALIAS KS_B64; do
            [ -n "${!v}" ] || { echo "::error::Secret for $v is missing. See RELEASE_SETUP.md step 3"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor Android project
        run: |
          mkdir shell && cd shell
          npm init -y > /dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          echo '<!doctype html><title>AAVIRA</title><p>Loading...</p>' > www/index.html
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": {
              "url": "${SITE_URL}?shell=apk&sv=${VERSION}",
              "androidScheme": "https",
              "allowNavigation": ["managerdukaan-cloud.github.io"]
            }
          }
          EOF
          npx cap add android

      - name: Version, permissions, colours
        working-directory: shell/android
        run: |
          CODE=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VERSION\"/" app/build.gradle
          grep -q "versionCode $CODE" app/build.gradle || { echo "::error::Could not set versionCode in build.gradle"; exit 1; }
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' app/src/main/AndroidManifest.xml
          sed -i 's/#FFFFFF/#581D32/' app/src/main/res/values/ic_launcher_background.xml || true

      - name: Launcher icons (cosmetic, may be skipped)
        continue-on-error: true
        run: |
          pip install pillow > /dev/null
          python3 - <<'PY'
          from PIL import Image
          res = "shell/android/app/src/main/res"
          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          fg = {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}
          a = Image.open("icons/icon-512.png").convert("RGBA")
          m = Image.open("icons/icon-maskable-512.png").convert("RGBA")
          for d, sz in legacy.items():
              for n in ("ic_launcher.png", "ic_launcher_round.png"):
                  a.resize((sz, sz), Image.LANCZOS).save(f"{res}/mipmap-{d}/{n}")
          for d, sz in fg.items():
              inner = int(sz * 0.66)
              canvas = Image.new("RGBA", (sz, sz), (0, 0, 0, 0))
              canvas.paste(m.resize((inner, inner), Image.LANCZOS), ((sz - inner) // 2, (sz - inner) // 2))
              canvas.save(f"{res}/mipmap-{d}/ic_launcher_foreground.png")
          PY

      - name: Build release APK and AAB
        working-directory: shell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign APK and AAB
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=shell/android/app/build/outputs
          APK=$(ls $OUT/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out aavira.apk aligned.apk
          "$BT/apksigner" verify --print-certs aavira.apk | head -3
          cp $OUT/bundle/release/app-release.aab aavira.aab
          jarsigner -keystore release.jks -storepass:env KS_PASS -keypass:env KEY_PASS -digestalg SHA-256 -sigalg SHA256withRSA aavira.aab "$KEY_ALIAS"
          rm -f release.jks aligned.apk

      - name: Keep AAB for Play Store (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aavira-playstore-aab-${{ inputs.version }}
          path: aavira.aab
          retention-days: 30

      - name: Publish APK in GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: AAVIRA ${{ inputs.version }}
          files: aavira.apk
